name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes (unitários + integração com SQLite real e migrations de produção)
        run: pnpm test
      - name: Build (painel + bundle do Worker em dry-run, sem deploy)
        run: pnpm build
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
